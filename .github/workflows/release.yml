# Builds TinyFugue for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named tinyfugue-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds tf, its tf-lib folder and
# the tinyfugue start script, which av launches.
# For everyone else: .deb, .rpm, .apk and Arch packages from the same
# static Linux build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v5.0b8-av.1: upstream's version, then our packaging
# release. Runs on a pushed tag, or by hand for an existing tag.
#
# Linux: fully static in Alpine (asciiverse/build-static.sh). macOS: Apple
# silicon, linking nothing outside the system (asciiverse/build-macos.sh).
# No Windows build: TinyFugue is a Unix program.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: tinyfugue
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build-static.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file build/tf

      - name: Package for av
        run: |
          # the start script sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp -r build/tf build/tf-lib asciiverse/tinyfugue COPYING README stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: sh asciiverse/build-macos.sh

      - name: Package
        run: |
          mkdir -p stage dist
          cp -r build/tf build/tf-lib asciiverse/tinyfugue COPYING README stage/
          tar -czf "dist/$ID-aarch64-apple-darwin.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "TinyFugue $TAG" \
                 --notes "TinyFugue 5.0 beta 8 by Ken Keys with Debian's patches, built statically for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
